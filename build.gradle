plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'net.teamcastle'
version = '1.1.0'


compileJava.options.encoding = 'UTF-8'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = "unifiedvisionReleases"
        url = uri("https://repo.codeblocksmc.de/releases")
    }
}

java {
    targetCompatibility = JavaVersion.VERSION_21
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.6-R0.1-SNAPSHOT'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    implementation 'org.checkerframework:checker-qual:3.28.0'
    implementation("net.dv8tion:JDA:5.0.0-beta.20")
    implementation("de.codeblocksmc.codelib:CodeLib:3.5.1")
    implementation("com.codeblocksmc:TranslationSystem:4.1.0")
    implementation 'fr.mrmicky:fastboard:2.1.5'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

shadowJar {
    relocate 'fr.mrmicky.fastboard', 'net.teamcastle.gemgrab.scoreboard'
}