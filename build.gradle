plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

group = 'net.teamcastle'
version = '1.0-BETA'


compileJava.options.encoding = 'UTF-8'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

java {
    targetCompatibility = JavaVersion.VERSION_21
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.5-R0.1-SNAPSHOT'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    implementation 'org.checkerframework:checker-qual:3.28.0'
    implementation("net.dv8tion:JDA:5.0.0-beta.20")

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation platform('eu.cloudnetservice.cloudnet:bom:4.0.0-RC13')
    compileOnly 'eu.cloudnetservice.cloudnet:driver-api'
    compileOnly 'eu.cloudnetservice.cloudnet:bridge-api'
    compileOnly 'eu.cloudnetservice.cloudnet:wrapper-jvm-api'}